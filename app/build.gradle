import groovy.json.JsonOutput

plugins {
    alias(libs.plugins.android.application)
}

// A fresh clone must build without access to the team's Firebase project.
// Feature verification uses -PrequireFirebase=true and the real team config.
def firebaseConfigured = file('google-services.json').exists()
if (firebaseConfigured) {
    apply plugin: 'com.google.gms.google-services'
}
if (providers.gradleProperty('requireFirebase').orNull == 'true' && !firebaseConfigured) {
    throw new GradleException('Missing app/google-services.json. Follow docs/SETUP.md before Firebase feature verification.')
}

def localConfig = new Properties()
def localConfigFile = rootProject.file('local.properties')
if (localConfigFile.exists()) {
    localConfigFile.withInputStream { localConfig.load(it) }
}
def kmaServiceKey = providers.environmentVariable('KMA_SERVICE_KEY')
        .orElse(localConfig.getProperty('KMA_SERVICE_KEY', '')).get()

// Signing values are supplied only for local release builds and trusted tag jobs.
def releaseSigning = ['RELEASE_STORE_FILE', 'RELEASE_STORE_PASSWORD',
                      'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD'].collectEntries {
    [(it): providers.environmentVariable(it).orNull]
}
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.isBlank() }
def releaseVersionName = providers.gradleProperty('releaseVersionName').orElse('0.1.0').get()
def releaseVersionCode = providers.gradleProperty('releaseVersionCode').orElse('1').get()
if (!(releaseVersionName ==~ /(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)/) ||
        !(releaseVersionCode ==~ /[1-9]\d*/) ||
        new BigInteger(releaseVersionCode) > 2100000000) {
    throw new GradleException('Invalid releaseVersionName (X.Y.Z) or releaseVersionCode (1..2100000000).')
}

android {
    namespace 'com.kwmobile.hometiming'
    compileSdk libs.versions.compileSdk.get().toInteger()
    buildToolsVersion libs.versions.buildTools.get()

    defaultConfig {
        applicationId 'com.kwmobile.hometiming'
        testInstrumentationRunner providers.gradleProperty('deviceTestRunner')
                .orElse('com.kwmobile.hometiming.ui.main.MvpFlowInstrumentation').get()
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode releaseVersionCode.toInteger()
        versionName releaseVersionName

        buildConfigField 'String', 'KMA_SERVICE_KEY', JsonOutput.toJson(kmaServiceKey)
        buildConfigField 'boolean', 'FIREBASE_CONFIGURED', firebaseConfigured.toString()
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseSigning.RELEASE_STORE_FILE)
                storePassword releaseSigning.RELEASE_STORE_PASSWORD
                keyAlias releaseSigning.RELEASE_KEY_ALIAS
                keyPassword releaseSigning.RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
    }
}

// Never silently produce an unsigned APK when a release is requested.
tasks.register('checkReleaseSigning') {
    doLast {
        if (!hasReleaseSigning || !rootProject.file(releaseSigning.RELEASE_STORE_FILE).isFile()) {
            throw new GradleException('Release signing is missing. Follow docs/SETUP.md#release-apk.')
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') {
        dependsOn tasks.named('checkReleaseSigning')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencyLocking {
    lockAllConfigurations()
    // Studio resolves temporary *ClasspathCopy configurations without persisted lock state.
    // DEFAULT still validates existing locks during sync; actual builds require lock state.
    lockMode = System.getProperty('idea.sync.active') == 'true' ? LockMode.DEFAULT : LockMode.STRICT
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.fragment
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.recyclerview
    implementation libs.androidx.work.runtime
    implementation libs.guava
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp.logging
    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view
    implementation libs.mlkit.text.korean
    implementation libs.mlkit.text.latin
    testImplementation libs.junit
}
