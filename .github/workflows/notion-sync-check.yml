name: Notion sync checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/notion/**'
      - .python-version
      - .github/workflows/notion-sync.yml
      - .github/workflows/notion-sync-check.yml
  push:
    branches: [main]
    paths:
      - 'scripts/notion/**'
      - .python-version
      - .github/workflows/notion-sync.yml
      - .github/workflows/notion-sync-check.yml

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Check offline API contracts
        run: python -m unittest discover -s scripts/notion/tests -v
