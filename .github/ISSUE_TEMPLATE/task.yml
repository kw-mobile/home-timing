name: 구현 작업
description: 합의한 MVP 범위에서 작업을 나눕니다.
title: "[기능] "
body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적과 범위
      description: docs/MVP.md의 어느 흐름을 구현하나요?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      placeholder: "- [ ] 사용자가 확인할 수 있는 동작"
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 검증 방법
      description: 단위 테스트, 실기기, 두 기기 검증 중 필요한 것을 적어주세요.
